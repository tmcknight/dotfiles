name: lint

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bash syntax check
        run: |
          for f in install.sh macos/setup.sh linux/setup.sh shared/lib.sh shared/claude-statusline.sh; do
              bash -n "$f"
          done

      # zsh is not on the runner image. shellcheck has no zsh support, so the
      # zsh files below get a parse check only.
      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh

      # Parse-only: this catches a typo that would break every new shell, but
      # not a wrong flag or a pipe that yields nothing — both of which these
      # files have shipped. Those need running the command.
      - name: Zsh syntax check
        run: |
          for f in shared/.zshrc shared/.aliases; do
              zsh -n "$f"
          done

      - name: ShellCheck
        run: shellcheck -x install.sh macos/setup.sh linux/setup.sh shared/lib.sh shared/claude-statusline.sh

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName, [ref]$null, [ref]$errors)
              if ($errors) {
                  Write-Host "FAIL $($_.FullName)"
                  $errors | ForEach-Object { Write-Host "  $($_.Message)" }
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }

  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate JSON configs
        run: |
          for f in shared/theme.omp.json windows/Terminal/settings.json windows/WinGet/winget-packages.json; do
              jq empty "$f" || exit 1
          done
